# Publishes to npm when the private release process pushes the `release` branch.
# Uses npm provenance (OIDC) — no NPM_TOKEN secret required if the package is
# configured for trusted publishing; otherwise add NPM_TOKEN and a
# `- run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc` step.
name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    # The release branch is pushed to both the private origin and the public
    # mirror, so without this guard the private repository also tries to
    # publish and fails on every release — it has no trusted-publisher claim,
    # and the version has already been taken by the mirror's successful run.
    if: github.repository == 'Syntax-Syllogism/aloop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Publish to npm
        run: npm publish --access public --provenance
