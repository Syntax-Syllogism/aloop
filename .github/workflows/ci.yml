# aloop CI Pipeline
#
# Runs deterministic checks on every pull request and push to master.

name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  ci:
    name: CI Checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test full suite
        if: runner.os != 'Windows'
        shell: bash
        run: npm test

      - name: Test native Windows platform suite
        if: runner.os == 'Windows'
        shell: bash
        run: npm test -- test/platform.test.mjs
